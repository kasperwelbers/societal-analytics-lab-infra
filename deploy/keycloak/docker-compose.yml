# Keycloak with PostgreSQL, behind Caddy (TLS via Let's Encrypt).
# Setup and maintenance: docs/keycloak-deploy.md
#
# All settings and secrets come from .env (copy .env.example).

name: keycloak

services:
  keycloak:
    build:
      context: .
      args:
        # Keycloak version: change it here to upgrade (see docs/keycloak-deploy.md)
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2}
    image: lab-keycloak
    # Built locally from the Dockerfile: never try to download it from a registry
    pull_policy: never
    command: ["start", "--optimized"]
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Public URL, and a separate URL for the admin console
      KC_HOSTNAME: https://${KC_HOSTNAME:?set KC_HOSTNAME in .env}
      KC_HOSTNAME_ADMIN: https://${KC_HOSTNAME_ADMIN:?set KC_HOSTNAME_ADMIN in .env}
      # Re-encrypt: Caddy terminates the public TLS connection, and connects to Keycloak over
      # TLS with an internal certificate (created by tls-init). Plain HTTP is disabled.
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/conf/internal-tls/keystore.p12
      KC_HTTPS_KEY_STORE_PASSWORD: ${INTERNAL_TLS_KEYSTORE_PASSWORD:?set INTERNAL_TLS_KEYSTORE_PASSWORD in .env}
      # The management interface (health checks, port 9000) stays on plain HTTP; it is not exposed
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_PROXY_HEADERS: xforwarded
      # Deprecated option that is only useful behind a load balancer (see the reverse proxy guide)
      KC_SPI_STICKY_SESSION_ENCODER__INFINISPAN__SHOULD_ATTACH_ROUTE: "false"
      # Temporary admin, only created on the very first start (when the master realm doesn't exist yet)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-temp-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
    # The JVM uses 70% of this limit as maximum heap by default
    mem_limit: 2g
    healthcheck:
      # The image has no curl; ask the management port (9000) for readiness with bash.
      # /health/ready returns 200 when Keycloak is ready, and 503 while it is starting.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - internal-tls:/opt/keycloak/conf/internal-tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    networks:
      - db
      - web
      - mail

  # Creates the internal certificate for Caddy -> Keycloak on the first start (see internal-tls.sh)
  tls-init:
    image: lab-keycloak
    # Built by the keycloak service above: never try to download it from a registry
    pull_policy: never
    entrypoint: ["bash", "/internal-tls.sh"]
    restart: "no"
    environment:
      INTERNAL_TLS_KEYSTORE_PASSWORD: ${INTERNAL_TLS_KEYSTORE_PASSWORD:?set INTERNAL_TLS_KEYSTORE_PASSWORD in .env}
    volumes:
      - ./internal-tls.sh:/internal-tls.sh:ro
      - internal-tls:/opt/keycloak/conf/internal-tls
    network_mode: none

  # Applies the realm configuration in realms/ (configuration as code). Not started by "up":
  #   sudo docker compose run --rm keycloak-config
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    profiles: ["config"]
    restart: "no"
    # Stop with a clear message if a value is missing in .env (checked here, so that other
    # docker compose commands keep working while these values are not filled in yet)
    entrypoint:
      - /bin/sh
      - -c
      - >-
        missing="";
        for name in KEYCLOAK_CLIENTSECRET KC_HOSTNAME APPS_HOSTNAME APP_REGISTRATION_CLIENT_SECRET
        SMTP_FROM IDP_GOOGLE_CLIENT_ID IDP_GOOGLE_CLIENT_SECRET IDP_GITHUB_CLIENT_ID
        IDP_GITHUB_CLIENT_SECRET; do [ -n "$$(printenv $$name)" ] || missing="$$missing $$name"; done;
        if [ -n "$$missing" ]; then echo "Missing in .env:$$missing" >&2; exit 1; fi;
        exec java $$JAVA_OPTS -jar /app/keycloak-config-cli.jar
    environment:
      KEYCLOAK_URL: https://keycloak:8443
      KEYCLOAK_GRANTTYPE: client_credentials
      KEYCLOAK_CLIENTID: keycloak-config
      KEYCLOAK_CLIENTSECRET: ${KEYCLOAK_CONFIG_SECRET:-}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      # Trust Keycloak's internal certificate (created by tls-init)
      KEYCLOAK_TLS_TRUSTSTOREPATH: /internal-tls/truststore.p12
      KEYCLOAK_TLS_TRUSTSTOREPASSWORD: truststore
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Apply every file on every run, so changes made in the admin console to managed
      # settings are reset (by default, unchanged files are skipped)
      IMPORT_CACHE_ENABLED: "false"
      # Never delete things that are not in realms/: external login providers, flows, client
      # scopes, roles, clients and required actions added in the admin console (or by the app
      # registration site) stay. Something removed from a realm file must then also be deleted
      # in the admin console (see the runbook).
      IMPORT_MANAGED_IDENTITYPROVIDER: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDERMAPPER: no-delete
      IMPORT_MANAGED_AUTHENTICATIONFLOW: no-delete
      IMPORT_MANAGED_CLIENTSCOPE: no-delete
      IMPORT_MANAGED_ROLE: no-delete
      IMPORT_MANAGED_CLIENT: no-delete
      IMPORT_MANAGED_REQUIREDACTION: no-delete
      # Values used in realms/*.yaml as $(env:NAME)
      KC_HOSTNAME: ${KC_HOSTNAME}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Societal Analytics Lab}
      IDP_GOOGLE_CLIENT_ID: ${IDP_GOOGLE_CLIENT_ID:-}
      IDP_GOOGLE_CLIENT_SECRET: ${IDP_GOOGLE_CLIENT_SECRET:-}
      IDP_GITHUB_CLIENT_ID: ${IDP_GITHUB_CLIENT_ID:-}
      IDP_GITHUB_CLIENT_SECRET: ${IDP_GITHUB_CLIENT_SECRET:-}
      APPS_HOSTNAME: ${APPS_HOSTNAME:-}
      APP_REGISTRATION_CLIENT_SECRET: ${APP_REGISTRATION_CLIENT_SECRET:-}
    volumes:
      - ./realms:/config:ro
      - internal-tls:/internal-tls:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - web

  # Site where users register apps (OIDC clients) in the idp realm (see docs/app-registration.md)
  app-registration:
    build: ./app-registration
    image: lab-app-registration
    pull_policy: never
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${APPS_HOSTNAME}
      OIDC_ISSUER: https://${KC_HOSTNAME}/realms/idp
      KEYCLOAK_INTERNAL_URL: https://keycloak:8443
      OIDC_CLIENT_ID: app-registration
      OIDC_CLIENT_SECRET: ${APP_REGISTRATION_CLIENT_SECRET:-}
      SESSION_SECRET: ${APP_REGISTRATION_SESSION_SECRET:-}
      MAX_APPS_PER_USER: ${MAX_APPS_PER_USER:-3}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Trust Keycloak's internal certificate (created by tls-init)
      NODE_EXTRA_CA_CERTS: /internal-tls/tls.crt
    volumes:
      - internal-tls:/internal-tls:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - web

  # Email relay: Keycloak sends all email here, without a password. Only the relay has the
  # credentials of the email provider, so realm admins can't redirect them (see the runbook).
  # It only accepts the sender address SMTP_FROM, caps the number of emails for the whole
  # Keycloak instance, and queues emails while the provider is unreachable.
  mail-relay:
    image: boky/postfix:5.2.1-alpine
    restart: unless-stopped
    # Stop with a clear message if a value is missing in .env (checked here, so that other
    # docker compose commands keep working while these values are not filled in yet)
    command:
      - /bin/sh
      - -c
      - >-
        missing=""; for name in SMTP_HOST SMTP_USER SMTP_PASSWORD SMTP_FROM; do
        [ -n "$$(printenv $$name)" ] || missing="$$missing $$name"; done;
        if [ -n "$$missing" ]; then echo "Missing in .env:$$missing" >&2; exit 1; fi;
        exec /scripts/run.sh
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RELAYHOST: "[${SMTP_HOST:-}]:${SMTP_PORT:-587}"
      RELAYHOST_USERNAME: ${SMTP_USER:-}
      RELAYHOST_PASSWORD: ${SMTP_PASSWORD:-}
      # TLS to the provider is required (STARTTLS on port 587)
      POSTFIX_smtp_tls_security_level: encrypt
      POSTFIX_myhostname: ${KC_HOSTNAME}
      # Only the sender address of the realms (domain checks are replaced by this exact check)
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      POSTFIX_smtpd_sender_restrictions: "check_sender_access inline:{ ${SMTP_FROM:-}=OK }, reject"
      # The cap: at most EMAIL_RELAY_LIMIT emails per EMAIL_RELAY_LIMIT_PERIOD from Keycloak, in
      # a fixed period that starts with the first email (Postfix resets the count after each
      # period). Above it, the relay refuses emails until the period ends (Keycloak shows an
      # error). Postfix exempts its own networks from limits by default: not here.
      POSTFIX_smtpd_client_message_rate_limit: ${EMAIL_RELAY_LIMIT:-400}
      POSTFIX_anvil_rate_time_unit: ${EMAIL_RELAY_LIMIT_PERIOD:-1h}
      POSTFIX_smtpd_client_event_limit_exceptions: 127.0.0.1/32
    volumes:
      # The queue survives restarts
      - mail-queue:/var/spool/postfix
    mem_limit: 256m
    networks:
      - mail
      - mail-out

  postgres:
    # Keycloak 26.8 is tested with PostgreSQL 18
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/
      - postgres-data:/var/lib/postgresql
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - db

  caddy:
    # Caddy with the rate limit module (see Caddy.Dockerfile)
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    image: lab-caddy
    pull_policy: never
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN}
      APPS_HOSTNAME: ${APPS_HOSTNAME:?set APPS_HOSTNAME in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Email limit per IP address (the limits per app are in local/email-tiers.caddy)
      EMAIL_LIMIT_PER_IP: ${EMAIL_LIMIT_PER_IP:-200}
      EMAIL_LIMIT_PER_IP_WINDOW: ${EMAIL_LIMIT_PER_IP_WINDOW:-1h}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Local settings, not in the repository (prepared by caddy-init): restrictions of the
      # admin hostname, and the email limits per app. A folder, not single files, so that
      # Caddy always sees the current version of an edited file.
      - ./local:/etc/caddy/local:ro
      - caddy-data:/data
      - caddy-config:/config
      # Only tls.crt is used: the certificate Caddy trusts for its connection to Keycloak
      - internal-tls:/internal-tls:ro
    depends_on:
      keycloak:
        condition: service_started
      caddy-init:
        condition: service_completed_successfully
    networks:
      - web

  # Prepares the local Caddy settings in local/ (see caddy-init.sh), so that Caddy can always
  # start: creates missing files from the examples, and never changes an existing file.
  caddy-init:
    image: lab-caddy
    # Built by the caddy service above: never try to download it from a registry
    pull_policy: never
    restart: "no"
    entrypoint: ["/bin/sh", "/deploy/caddy-init.sh"]
    volumes:
      - ./:/deploy
    network_mode: none

networks:
  # PostgreSQL is only reachable by Keycloak, and has no internet access
  db:
    internal: true
  # Keycloak and Caddy; Keycloak needs internet access for the external login providers
  web: {}
  # The email relay is only reachable by Keycloak
  mail:
    internal: true
  # The email relay's connection to the email provider
  mail-out: {}

volumes:
  postgres-data:
  mail-queue:
  internal-tls:
  caddy-data:
  caddy-config:
