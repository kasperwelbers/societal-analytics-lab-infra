# Realm "idp": the shared login (identity provider) for servers run by others.
#
# Applied with keycloak-config-cli: see "Configuration as code" in docs/keycloak-deploy.md.
# - Values written as "dollar, (env:NAME)" come from .env, substituted by keycloak-config-cli.
#   (Not written literally here: keycloak-config-cli also substitutes inside comments.)
# - Values written as "dollar, {vault.name}" are secrets that Keycloak reads from the vault
#   folder at runtime; they are never stored in the database.
#
# Differences with the lab realm: anyone can register (also via Google or GitHub), and 2FA is
# optional: users who set up a second factor are asked for it, others are not. Servers that
# need 2FA for sensitive actions request it themselves (step-up, see the Authentication standard).

realm: idp
enabled: true

# --- Login and registration ---------------------------------------------------------------
registrationAllowed: true
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
verifyEmail: true
resetPasswordAllowed: true
rememberMe: false
passwordPolicy: "length(10) and upperCase(1) and digits(1) and notUsername(undefined) and notEmail(undefined)"

# --- Timeouts and sessions (seconds) ------------------------------------------------------
accessCodeLifespanUserAction: 900   # "Login action timeout": time for e.g. setting up 2FA
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 1800

# --- Security defenses and events ---------------------------------------------------------
bruteForceProtected: true
eventsEnabled: true
eventsExpiration: 7776000           # 90 days
adminEventsEnabled: true
adminEventsDetailsEnabled: false

# --- Email --------------------------------------------------------------------------------
smtpServer:
  host: "$(env:SMTP_HOST)"
  port: "$(env:SMTP_PORT)"
  ssl: "$(env:SMTP_SSL)"
  starttls: "false"
  auth: "true"
  user: "$(env:SMTP_USER)"
  password: "${vault.smtpPassword}"
  from: "$(env:SMTP_FROM)"
  fromDisplayName: "$(env:SMTP_FROM_NAME)"

# --- Flows --------------------------------------------------------------------------------
browserFlow: browser-2fa-optional

# --- The amr claim (2FA signal for our software, see the Authentication standard) ---------
clientScopes:
  - name: amr
    description: "Authentication methods (amr claim): 'mfa' when a second factor was used"
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: amr
        protocol: openid-connect
        protocolMapper: oidc-amr-mapper
        consentRequired: false
        config:
          id.token.claim: "true"
          access.token.claim: "true"
          introspection.token.claim: "true"
defaultDefaultClientScopes:
  - role_list
  - saml_organization
  - AuthnContextClassRef
  - profile
  - email
  - roles
  - web-origins
  - acr
  - basic
  - amr

# --- App registration (see docs/app-registration.md) --------------------------------------
# The registration app logs users in with the client "app-registration", and creates and edits
# their apps (clients) with that client's service account. That service account has the role
# "client-self-service", which makes the client policy below apply to every change it makes:
# consent is always required, PKCE is required, and redirect URIs must be https (or http on
# localhost / 127.0.0.1 / [::1]) without wildcards.
roles:
  realm:
    - name: client-self-service
      description: "Changes to clients made by holders of this role must follow the self-service client policy"
clients:
  - clientId: app-registration
    name: App registration
    description: "The app registration site, and its service account that manages the registered apps"
    enabled: true
    protocol: openid-connect
    publicClient: false
    secret: "$(env:APP_REGISTRATION_CLIENT_SECRET)"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    implicitFlowEnabled: false
    serviceAccountsEnabled: true
    consentRequired: false
    # The admin API checks the roles in the service account's token, so keep the full scope
    fullScopeAllowed: true
    rootUrl: "https://$(env:APPS_HOSTNAME)"
    baseUrl: "https://$(env:APPS_HOSTNAME)/"
    redirectUris: ["https://$(env:APPS_HOSTNAME)/callback"]
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "https://$(env:APPS_HOSTNAME)/"
    defaultClientScopes: [basic, profile, email, roles, web-origins, acr, amr, kc-admin-api]
    optionalClientScopes: []
users:
  - username: service-account-app-registration
    enabled: true
    serviceAccountClientId: app-registration
    realmRoles: [default-roles-idp, client-self-service]
    clientRoles:
      realm-management: [manage-clients]
clientProfiles:
  profiles:
    - name: self-service-clients
      description: "Rules for apps registered through the app registration site"
      executors:
        - executor: consent-required
          configuration: { auto-configure: "true" }
        - executor: pkce-enforcer
          configuration: { auto-configure: "true" }
        - executor: secure-redirect-uris-enforcer
          configuration:
            allow-ipv4-loopback-address: "true"
            allow-ipv6-loopback-address: "true"
            # Needed for http://localhost during development. Keycloak can't limit http to
            # loopback addresses only, so the registration app checks that itself.
            allow-http-scheme: "true"
            allow-wildcard-context-path: "false"
            allow-private-use-uri-scheme: "false"
            allow-open-redirect: "false"
clientPolicies:
  policies:
    - name: self-service-clients
      description: "Applies to client changes made by holders of the role client-self-service"
      enabled: true
      conditions:
        - condition: client-updater-source-roles
          configuration: { is-negative-logic: "false", roles: [client-self-service] }
      profiles: [self-service-clients]

# --- External login providers -------------------------------------------------------------
identityProviders:
  - alias: google
    providerId: google
    enabled: true
    trustEmail: true
    storeToken: false
    addReadTokenRoleOnCreate: false
    linkOnly: false
    hideOnLogin: false
    firstBrokerLoginFlowAlias: first broker login
    postBrokerLoginFlowAlias: post-login-2fa-optional
    config:
      clientId: "$(env:IDP_GOOGLE_CLIENT_ID)"
      clientSecret: "${vault.googleClientSecret}"
      syncMode: IMPORT
      pkceEnabled: "true"
      pkceMethod: S256
  - alias: github
    providerId: github
    enabled: true
    trustEmail: false
    storeToken: false
    addReadTokenRoleOnCreate: false
    linkOnly: false
    hideOnLogin: false
    firstBrokerLoginFlowAlias: first broker login
    postBrokerLoginFlowAlias: post-login-2fa-optional
    config:
      clientId: "$(env:IDP_GITHUB_CLIENT_ID)"
      clientSecret: "${vault.githubClientSecret}"
      syncMode: IMPORT

# --- Authentication flows -----------------------------------------------------------------
# Optional 2FA: the default browser flow, with passkeys/security keys and recovery codes
# allowed as alternatives to OTP, and amr reference values ("pwd" or "mfa").
authenticationFlows:
  - alias: browser-2fa-optional
    description: "Browser login with optional 2FA"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
        priority: 10
        authenticatorFlow: false
      - authenticator: identity-provider-redirector
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
      - flowAlias: browser-2fa-optional-forms
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: true
  - alias: browser-2fa-optional-forms
    description: "Password, then 2FA if the user has a second factor"
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        authenticatorConfig: browser-2fa-optional-amr-pwd
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: browser-2fa-optional-2fa
        requirement: CONDITIONAL
        priority: 20
        authenticatorFlow: true
  - alias: browser-2fa-optional-2fa
    description: "Second factor, for users who have one"
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: conditional-credential
        authenticatorConfig: browser-2fa-optional-skip-after-passkey
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
      - authenticator: auth-otp-form
        authenticatorConfig: browser-2fa-optional-amr-otp
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: false
      - authenticator: webauthn-authenticator
        authenticatorConfig: browser-2fa-optional-amr-webauthn
        requirement: ALTERNATIVE
        priority: 40
        authenticatorFlow: false
      - authenticator: auth-recovery-authn-code-form
        authenticatorConfig: browser-2fa-optional-amr-recovery
        requirement: ALTERNATIVE
        priority: 50
        authenticatorFlow: false

  # After a login with Google or GitHub (which replaces only the password): the second factor,
  # if the user has one. "Allow access" is needed because a flow in which nothing runs (a user
  # without a second factor) counts as failed; it doesn't bypass the 2FA sub-flow when that runs.
  - alias: post-login-2fa-optional
    description: "2FA after login with an external provider, if the user has a second factor"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - flowAlias: post-login-2fa-optional-2fa
        requirement: CONDITIONAL
        priority: 10
        authenticatorFlow: true
      - authenticator: allow-access-authenticator
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  - alias: post-login-2fa-optional-2fa
    description: "Second factor, for users who have one"
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        authenticatorConfig: post-login-2fa-optional-amr-otp
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
      - authenticator: webauthn-authenticator
        authenticatorConfig: post-login-2fa-optional-amr-webauthn
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: false
      - authenticator: auth-recovery-authn-code-form
        authenticatorConfig: post-login-2fa-optional-amr-recovery
        requirement: ALTERNATIVE
        priority: 40
        authenticatorFlow: false

authenticatorConfig:
  - alias: browser-2fa-optional-amr-pwd
    config: { default.reference.value: pwd, default.reference.maxAge: "1800" }
  - alias: browser-2fa-optional-skip-after-passkey
    config: { credentials: webauthn-passwordless }
  - alias: browser-2fa-optional-amr-otp
    config: { default.reference.value: mfa, default.reference.maxAge: "1800" }
  - alias: browser-2fa-optional-amr-webauthn
    config: { default.reference.value: mfa, default.reference.maxAge: "1800" }
  - alias: browser-2fa-optional-amr-recovery
    config: { default.reference.value: mfa, default.reference.maxAge: "1800" }
  - alias: post-login-2fa-optional-amr-otp
    config: { default.reference.value: mfa, default.reference.maxAge: "1800" }
  - alias: post-login-2fa-optional-amr-webauthn
    config: { default.reference.value: mfa, default.reference.maxAge: "1800" }
  - alias: post-login-2fa-optional-amr-recovery
    config: { default.reference.value: mfa, default.reference.maxAge: "1800" }
