site_name: Lab Infrastructure Registry
theme:
  name: material

nav:
  - Home: index.md
  - AmCAT: amcat.md
  - Authentication:
      - Standard: auth.md
      - Installation guide: auth-install.md
      - Migration guide: auth-migration.md
      - "2FA: where should it live?": auth-2fa.md
  - Lab authentication: lab-auth.md

markdown_extensions:
  - admonition
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
