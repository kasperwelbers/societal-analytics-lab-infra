site_name: Lab Infrastructure Registry
theme:
  name: material

nav:
  - Home: index.md
  - AmCAT: amcat.md
  - Authentication:
      - Standard: auth.md
      - Installation guide: auth-install.md
      - Migration guide: auth-migration.md
  - Our Keycloak:
      - Keycloak setup: keycloak.md
      - Keycloak deployment: keycloak-deploy.md
      - Lab authentication: lab-auth.md
  - Decisions: decisions.md
  - Background:
      - "2FA: where should it live?": auth-2fa.md
      - Provider comparison: auth-providers.md
  - Servers:
      - Lab server: lab-server.md
      - University VMs: vm.md
  - Policies:
      - Privacy statement: policies/privacy.md
      - Acceptable use policy: policies/aup.md
      - Privacy template for self-hosting: policies/privacy-template.md

markdown_extensions:
  - admonition
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
