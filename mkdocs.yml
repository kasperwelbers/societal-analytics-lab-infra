site_name: Lab Infrastructure Registry
theme:
  name: material

validation:
  anchors: warn

nav:
  - Overview: index.md
  - Servers:
      - Lab server: servers/lab.md
      - Database server: servers/database.md
      - Keycloak VM: servers/keycloak.md
      - Service VMs: servers/service-vms.md
      - Hosted services: servers/services.md
  - Installation guides:
      - University VMs: install/vm.md
      - Apps on our servers: install/apps.md
      - Backups: install/backups.md
      - Lab server: install/lab-server.md
      - Keycloak VM: install/keycloak.md
      - "⚠️ Docker warnings": install/docker.md
  - Software development:
      - Our software: software.md
      - Authentication standard: auth.md
      - Authentication provider: auth-install.md
      - Migration guide: auth-migration.md
      - AmCAT: amcat.md
      - AnnoTinder: annotinder.md
  - Policies:
      - Privacy statement: policies/privacy.md
      - Acceptable use policy: policies/aup.md
  - Discussion:
      - About: discussion.md
      - Decisions: decisions.md
      - "2FA: where should it live?": auth-2fa.md
      - Provider comparison: auth-providers.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
